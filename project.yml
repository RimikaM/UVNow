name: UVNow
options:
  bundleIdPrefix: com.rimikamajumdar
  deploymentTarget:
    iOS: "17.0"
settings:
  SWIFT_VERSION: 6.0
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  UVNow:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - UVNow
    info:
      path: UVNow/Info.plist
      properties:
        CFBundleDisplayName: UV Now
        NSLocationWhenInUseUsageDescription: UVNow uses your location to show the current UV index.
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.rimikamajumdar.UVNow
      SWIFT_VERSION: 6.0
      ENABLE_HARDENED_RUNTIME: YES
      SWIFT_STRICT_CONCURRENCY: complete
